<!--
base.html - Layout utama untuk semua halaman
Menggunakan Bootstrap 5 dengan tema dark + sidebar navigasi
Semua halaman lain akan mewarisi (extends) template ini
-->
<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
    <!-- Meta tags untuk responsive design -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Media Codec Steganography{% endblock %}</title>

    <!-- Bootstrap 5 CSS dari CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons untuk icon sidebar -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS untuk kustomisasi tambahan -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- ===== SIDEBAR NAVIGASI ===== -->
    <!-- Sidebar tetap di kiri, bisa collapse di mobile -->
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <!-- Logo/brand system -->
                <i class="bi bi-shield-lock-fill me-2"></i>
                <span class="sidebar-brand">MediaCodec</span>
            </div>
            <hr class="sidebar-divider">
            <!-- Navigasi utama -->
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}"
                       href="{{ url_for('dashboard') }}">
                        <i class="bi bi-speedometer2 me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'image' %}active{% endif %}"
                       href="{{ url_for('image_page') }}">
                        <i class="bi bi-image me-2"></i> Image Codec
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'audio' %}active{% endif %}"
                       href="{{ url_for('audio_page') }}">
                        <i class="bi bi-music-note me-2"></i> Audio Codec
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'video' %}active{% endif %}"
                       href="{{ url_for('video_page') }}">
                        <i class="bi bi-film me-2"></i> Video Codec
                    </a>
                </li>
            </ul>
            <hr class="sidebar-divider">
            <!-- Footer sidebar dengan informasi sistem -->
            <div class="sidebar-footer">
                <small class="text-muted">v1.0 - Steganography System</small>
            </div>
        </div>

        <!-- ===== KONTEN UTAMA ===== -->
        <div id="page-content-wrapper">
            <!-- Navbar mobile (hanya muncul di layar kecil) -->
            <nav class="navbar navbar-dark bg-dark border-bottom d-md-none">
                <div class="container-fluid">
                    <button class="btn btn-dark" id="menu-toggle">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <span class="navbar-brand ms-2">MediaCodec</span>
                </div>
            </nav>

            <!-- Container utama untuk konten halaman -->
            <div class="container-fluid p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <!-- Bootstrap 5 JS Bundle dengan Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js untuk grafik dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
